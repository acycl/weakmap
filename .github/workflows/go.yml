name: Go
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-go
        name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: Verify the Go module
        run: go mod tidy -diff
      - name: Run all tests
        run: go test -race -v ./...
